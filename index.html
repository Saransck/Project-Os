        ];

        const BAR_COLORS = ['#60A5FA', '#F59E0B', '#34D399', '#F472B6', '#A3E635', '#FB923C', '#2DD4BF', '#FACC15'];

        const MIN_BLOCK_PX = 30;
        const MIN_BLOCK_PX_S = 24;
        const MAX_ITER = 10000;

        // Input limits — keep the simulation (and the DOM) small enough for a live demo
        const LIMITS = {
            arrival: [0, 100],
            burst: [1, 50],
            priority: [0, 99],
            quantum: [1, 50],
            count: [2, 20],
            maxProcs: 20,
        };

        /* ════════════════════════════════════════════════════════════════
           STATE
           ════════════════════════════════════════════════════════════════ */
        let processes = [];
        let processIdSeq = 1;
        let comparisonData = {};
        let compQuantum = 4;
        let lang = 'en';
        let lastError = null;   // { key, vars } so the message can be re-translated
        let lastSingle = null;   // { algo, quantum, result, stats }

        // Animation state
        let animTimeline = [];   // per-time-unit snapshots
        let animCurrentTime = 0;
        let animPlaying = false;
        let animInterval = null;
        let animSpeed = 500;
        let ganttAnimateOnce = false;                 // play the Gantt entry animation once after Run
        let pipePrev = { ready: new Set(), running: null, completed: new Set() };

        /* ════════════════════════════════════════════════════════════════
           DOM / STORAGE HELPERS
           ════════════════════════════════════════════════════════════════ */
        const $ = (id) => document.getElementById(id);

        function storeGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function storeSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ }
        }

        /* ════════════════════════════════════════════════════════════════
           I18N HELPERS
           ════════════════════════════════════════════════════════════════ */
        function t(key, vars) {
            let s = (I18N[lang] && I18N[lang][key] !== undefined) ? I18N[lang][key]
                : (I18N.en[key] !== undefined ? I18N.en[key] : key);
            if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
            return s;
        }

        function toggleLang() {
            setLang(lang === 'en' ? 'th' : 'en');
        }

        function setLang(next) {
            lang = I18N[next] ? next : 'en';
            storeSet('lang', lang);
            applyLang();
        }

        function applyLang() {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
            document.querySelectorAll('#langToggle [data-lang]').forEach(el => {
                el.classList.toggle('is-active', el.dataset.lang === lang);
            });
            $('btnAnimPlay').textContent = animPlaying ? t('anim.pause') : t('anim.play');
            renderAlgoInfo();
            renderProcessTable();
            if (lastError) showError(lastError.key, lastError.vars);
            if ($('sectionResult').style.display !== 'none' && lastSingle) refreshSingleView();
            if ($('sectionCompare').style.display !== 'none' && Object.keys(comparisonData).length) refreshCompareView();
        }

        /* ════════════════════════════════════════════════════════════════
           THEME TOGGLE
           ════════════════════════════════════════════════════════════════ */
        function toggleTheme() {
            const html = document.documentElement;
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            $('themeKnob').textContent = next === 'dark' ? '🌙' : '☀️';
            storeSet('theme', next);
        }

        (function restoreTheme() {
            const saved = storeGet('theme');
            if (saved === 'dark' || saved === 'light') {
                document.documentElement.setAttribute('data-theme', saved);
                const knob = document.getElementById('themeKnob');
                if (knob) knob.textContent = saved === 'dark' ? '🌙' : '☀️';
            }
        })();

        /* ════════════════════════════════════════════════════════════════
           INLINE ERRORS (replaces blocking alert() dialogs)
           ════════════════════════════════════════════════════════════════ */
        function showError(key, vars) {
            lastError = { key, vars };
            const box = $('formError');
            box.textContent = '⚠️ ' + t(key, vars);
            box.classList.add('is-visible');
            return null;
        }

        function clearError() {
            lastError = null;
            const box = $('formError');
            box.textContent = '';
            box.classList.remove('is-visible');
        }

        // Strict whole-number parsing: '', '2.5', '1e3', 'abc' are all rejected
        function parseIntStrict(raw) {
            const s = String(raw).trim();
            return /^-?\d+$/.test(s) ? Number(s) : NaN;
        }

        /**
         * Read an integer input and validate its range.
         * Returns the number, or null after showing an error.
         * `def` (optional) is used when the field is left empty.
         */
        function readField(id, fieldKey, min, max, def) {
            const el = $(id);
            const raw = el.value.trim();
            if (raw === '' && def !== undefined) return def;
            const v = parseIntStrict(raw);
            if (!Number.isInteger(v) || v < min || v > max) {
                el.focus();
                return showError('err.range', { field: t(fieldKey), min, max });
            }
            return v;
        }

        function readQuantum() {
            return readField('inpQuantum', 'f.quantum', LIMITS.quantum[0], LIMITS.quantum[1]);
        }

        /* ════════════════════════════════════════════════════════════════
           PRESETS — from Silberschatz Chapter 4
           [arrival, burst, priority]
           ════════════════════════════════════════════════════════════════ */
        const PRESETS = {
            fcfs1: { algo: 'fcfs', quantum: 4, procs: [[0, 24, 0], [0, 3, 0], [0, 3, 0]] },                      // p.24–25
            sjf1: { algo: 'sjf', quantum: 4, procs: [[0, 6, 0], [0, 8, 0], [0, 7, 0], [0, 3, 0]] },              // p.30
            sjf_preempt: { algo: 'sjf_preemptive', quantum: 4, procs: [[0, 8, 0], [1, 4, 0], [2, 9, 0], [3, 5, 0]] },              // p.36
            rr1: { algo: 'rr', quantum: 4, procs: [[0, 24, 0], [0, 3, 0], [0, 3, 0]] },                      // p.40
            priority1: { algo: 'priority', quantum: 4, procs: [[0, 10, 3], [0, 1, 1], [0, 2, 4], [0, 1, 5], [0, 5, 2]] },    // p.48
            // p.48 data with staggered arrivals, so preemptive and non-preemptive priority give different schedules
            priority_pre: { algo: 'priority_preemptive', quantum: 4, procs: [[0, 10, 3], [1, 1, 1], [2, 2, 4], [3, 1, 5], [4, 5, 2]] },
            priority_rr: { algo: 'priority_rr', quantum: 2, procs: [[0, 4, 3], [0, 5, 2], [0, 8, 2], [0, 7, 1], [0, 3, 3]] },     // p.53
        };

        function loadPreset(name) {
            const preset = PRESETS[name];
            if (!preset) return;
            clearProcesses();
            $('selAlgo').value = preset.algo;
            $('inpQuantum').value = preset.quantum;
            preset.procs.forEach(([a, b, p]) => pushProcess(a, b, p));
            renderProcessTable();
            onAlgoChange();
        }

        /* ════════════════════════════════════════════════════════════════
           PROCESS CRUD
           ════════════════════════════════════════════════════════════════ */
        function pushProcess(arrival, burst, priority) {
            processes.push({
                id: processIdSeq++,
                name: `P${processes.length + 1}`,
                arrival,
                burst,
                priority,
                color: PALETTE[processes.length % PALETTE.length],
            });
        }

        function addProcess() {
            clearError();
            if (processes.length >= LIMITS.maxProcs) return showError('err.maxProcs', { n: LIMITS.maxProcs });
            const arrival = readField('inpArrival', 'f.arrival', LIMITS.arrival[0], LIMITS.arrival[1], 0);
            if (arrival === null) return;
            const burst = readField('inpBurst', 'f.burst', LIMITS.burst[0], LIMITS.burst[1]);
            if (burst === null) return;
            const priority = readField('inpPriority', 'f.priority', LIMITS.priority[0], LIMITS.priority[1], 0);
            if (priority === null) return;
            pushProcess(arrival, burst, priority);
            renderProcessTable();
            $('inpBurst').value = '';
            $('inpBurst').focus();
        }

        function removeProcess(id) {
            processes = processes.filter(p => p.id !== id);
            reindexProcesses();
            renderProcessTable();
        }

        function clearProcesses() {
            processes = [];
            processIdSeq = 1;
            clearError();
            renderProcessTable();
            $('sectionResult').style.display = 'none';
            $('sectionCompare').style.display = 'none';
            animStop();
        }

        function reindexProcesses() {
            processes.forEach((p, i) => {
                p.name = `P${i + 1}`;
                p.color = PALETTE[i % PALETTE.length];
            });
        }

        /* ════════════════════════════════════════════════════════════════
           RANDOM PROCESS GENERATOR
           ════════════════════════════════════════════════════════════════ */
        function showRandomGen() {
            const panel = $('panelRandom');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function generateRandom() {
            clearError();
            // 0 is a valid value for Max Arrival / Max Priority (no `|| default` fallbacks)
            const count = readField('randCount', 'f.count', LIMITS.count[0], LIMITS.count[1]); if (count === null) return;
            const maxArr = readField('randMaxArr', 'f.maxArr', LIMITS.arrival[0], LIMITS.arrival[1]); if (maxArr === null) return;
            const minBurst = readField('randMinBurst', 'f.minBurst', LIMITS.burst[0], LIMITS.burst[1]); if (minBurst === null) return;
            const maxBurst = readField('randMaxBurst', 'f.maxBurst', LIMITS.burst[0], LIMITS.burst[1]); if (maxBurst === null) return;
            const maxPri = readField('randMaxPri', 'f.maxPri', LIMITS.priority[0], LIMITS.priority[1]); if (maxPri === null) return;
            if (minBurst > maxBurst) { $('randMinBurst').focus(); return showError('err.minMax'); }
            const dist = $('randDist').value;

            clearProcesses();
            const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

            for (let i = 0; i < count; i++) {
                const arrival = randInt(0, maxArr);
                let burst;
                if (dist === 'exponential') {
                    // Exponential distribution (p.5: many short bursts, few long ones), scaled to the chosen range
                    const mean = Math.max(1, (maxBurst - minBurst) / 4);
                    burst = Math.min(maxBurst, minBurst + Math.floor(-Math.log(1 - Math.random()) * mean));
                } else {
                    burst = randInt(minBurst, maxBurst);
                }
                pushProcess(arrival, burst, randInt(0, maxPri));
            }

            renderProcessTable();
            $('panelRandom').style.display = 'none';
        }

        /* ════════════════════════════════════════════════════════════════
           UI HELPERS
           ════════════════════════════════════════════════════════════════ */
        function onAlgoChange() {
            const algo = $('selAlgo').value;
            $('grpQuantum').className = QUANTUM_ALGOS.includes(algo) ? 'form-group' : 'form-group is-dimmed';
            $('grpPriority').className = PRIORITY_ALGOS.includes(algo) ? 'form-group' : 'form-group is-dimmed';
            renderAlgoInfo();
        }

        function renderAlgoInfo() {
            $('algoInfo').innerHTML = t(`info.${$('selAlgo').value}`);
        }

        function renderProcessTable() {
            const tbody = $('tbodyProcesses');
            if (!processes.length) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:24px;">${t('tbl.empty')}</td></tr>`;
                return;
            }
            tbody.innerHTML = processes.map(p => `
        <tr>
            <td><span class="dot-color" style="background:${p.color}"></span>${p.name}</td>
            <td>${p.arrival}</td>
            <td>${p.burst}</td>
            <td>${p.priority}</td>
            <td><button class="btn--remove" onclick="removeProcess(${p.id})">${t('btn.remove')}</button></td>
        </tr>`).join('');
        }

        /* ════════════════════════════════════════════════════════════════
           SCHEDULING ALGORITHMS
           Each returns { gantt, results } (+ queueTrace for RR-based ones:
           queueTrace[t] = ready-queue PIDs in real FIFO order at time t)
           ════════════════════════════════════════════════════════════════ */

        function buildResult(p, start, finish) {
            return {
                name: p.name, arrival: p.arrival, burst: p.burst, priority: p.priority,
                start, finish,
                waiting: finish - p.arrival - p.burst,   // = turnaround − burst
                turnaround: finish - p.arrival,
                response: start - p.arrival,             // first run − arrival
                color: p.color,
            };
        }

        function emitIdle(gantt, time, target) {
            if (time < target) {
                gantt.push({ pid: null, start: time, end: target });
                return target;
            }
            return time;
        }

        // ── FCFS ────────────────────────────────────────────────────────
        function scheduleFCFS(procs) {
            const sorted = [...procs].sort((a, b) => a.arrival - b.arrival || a.id - b.id);
            const gantt = [], results = {};
            let time = 0;
            for (const p of sorted) {
                time = emitIdle(gantt, time, p.arrival);
                const start = time, end = start + p.burst;
                gantt.push({ pid: p.id, name: p.name, start, end, color: p.color });
                results[p.id] = buildResult(p, start, end);
                time = end;
            }
            return { gantt, results };
        }

        // ── SJF (Non-preemptive) ────────────────────────────────────────
        function scheduleSJF(procs) {
            const pool = procs.map(p => ({ ...p, done: false }));
            const gantt = [], results = {};
            let time = 0, completed = 0;
            while (completed < pool.length) {
                const avail = pool.filter(p => !p.done && p.arrival <= time);
                if (!avail.length) {
                    const next = pool.filter(p => !p.done).sort((a, b) => a.arrival - b.arrival)[0];
                    time = emitIdle(gantt, time, next.arrival);
                    continue;
                }
                // shortest burst; ties → FCFS (p.29)
                avail.sort((a, b) => a.burst - b.burst || a.arrival - b.arrival || a.id - b.id);
                const p = avail[0];
                const start = time, end = start + p.burst;
                gantt.push({ pid: p.id, name: p.name, start, end, color: p.color });
                results[p.id] = buildResult(p, start, end);
                p.done = true;
                time = end;
                completed++;
            }
            return { gantt, results };
        }

        // ── Generic unit-time preemptive scheduler (SRTF, Priority-Pre) ─
        // `key(p)` = selection key, smaller wins; ties → earlier arrival, then lower PID.
        // The running process keeps the CPU on a tie (it arrived earlier), so no extra switch.
        function schedulePreemptiveByKey(procs, key) {
            const pool = procs.map(p => ({ ...p, rem: p.burst, firstStart: -1 }));
            const gantt = [], results = {};
            let time = 0, completed = 0;
            const maxT = procs.reduce((s, p) => s + p.burst, 0) + Math.max(...procs.map(p => p.arrival)) + 1;
            let prevPid = null, blockStart = 0;
            while (completed < pool.length && time <= maxT) {
                const avail = pool.filter(p => p.arrival <= time && p.rem > 0);
                if (!avail.length) {
                    const next = pool.filter(p => p.rem > 0).sort((a, b) => a.arrival - b.arrival)[0];
                    if (!next) break;
                    time = emitIdle(gantt, time, next.arrival);
                    blockStart = time;
                    continue;
                }
                avail.sort((a, b) => key(a) - key(b) || a.arrival - b.arrival || a.id - b.id);
                const p = avail[0];
                if (p.id !== prevPid) {
                    if (prevPid !== null) flushBlock(gantt, pool, prevPid, blockStart, time);
                    blockStart = time;
                    prevPid = p.id;
                }
                if (p.firstStart < 0) p.firstStart = time;
                p.rem--;
                time++;
                if (p.rem === 0) {
                    gantt.push({ pid: p.id, name: p.name, start: blockStart, end: time, color: p.color });
                    results[p.id] = buildResult(p, p.firstStart, time);
                    completed++;
                    prevPid = null;
                    blockStart = time;
                }
            }
            return { gantt, results };
        }

        // ── SJF Preemptive / SRTF (p.35–37) ─────────────────────────────
        function scheduleSRTF(procs) {
            return schedulePreemptiveByKey(procs, p => p.rem);
        }

        // ── Round Robin (p.38–41) ───────────────────────────────────────
        function scheduleRR(procs, quantum) {
            const q = quantum;
            const pool = procs.map(p => ({ ...p, rem: p.burst, firstStart: -1 }));
            const sorted = [...pool].sort((a, b) => a.arrival - b.arrival || a.id - b.id);
            const queue = [], gantt = [], results = {}, queueTrace = [];
            let time = 0, completed = 0, nextIdx = 0, iter = 0;
            const admit = () => { while (nextIdx < sorted.length && sorted[nextIdx].arrival <= time) queue.push(sorted[nextIdx++]); };
            admit();
            while (completed < pool.length && iter < MAX_ITER) {
                iter++;
                if (!queue.length) {
                    if (nextIdx >= sorted.length) break;
                    time = emitIdle(gantt, time, sorted[nextIdx].arrival);
                    admit();
                }
                const p = queue.shift();
                if (p.firstStart < 0) p.firstStart = time;
                const exec = Math.min(q, p.rem);
                // record the real ready-queue order for every time unit of this slice
                for (let tt = time; tt < time + exec; tt++) {
                    const order = queue.map(x => x.id);
                    for (let k = nextIdx; k < sorted.length && sorted[k].arrival <= tt; k++) order.push(sorted[k].id);
                    queueTrace[tt] = order;
                }
                gantt.push({ pid: p.id, name: p.name, start: time, end: time + exec, color: p.color });
                time += exec;
                p.rem -= exec;
                admit();                       // arrivals at `time` join before the preempted process
                if (p.rem > 0) {
                    queue.push(p);             // back to the tail (p.39)
                } else {
                    results[p.id] = buildResult(p, p.firstStart, time);
                    completed++;
                }
            }
            return { gantt, results, queueTrace };
        }

        // ── Priority (Non-preemptive) (p.47–48) ─────────────────────────
        function schedulePriority(procs) {
            const pool = procs.map(p => ({ ...p, done: false }));
            const gantt = [], results = {};
            let time = 0, completed = 0;
            while (completed < pool.length) {
                const avail = pool.filter(p => !p.done && p.arrival <= time);
                if (!avail.length) {
                    const next = pool.filter(p => !p.done).sort((a, b) => a.arrival - b.arrival)[0];
                    time = emitIdle(gantt, time, next.arrival);
                    continue;
                }
                // lower number = higher priority; ties → FCFS (p.47)
                avail.sort((a, b) => a.priority - b.priority || a.arrival - b.arrival || a.id - b.id);
                const p = avail[0];
                const start = time, end = start + p.burst;
                gantt.push({ pid: p.id, name: p.name, start, end, color: p.color });
                results[p.id] = buildResult(p, start, end);
                p.done = true;
                time = end;
                completed++;
            }
            return { gantt, results };
        }

        // ── Priority (Preemptive) (p.50) ────────────────────────────────
        function schedulePriorityPre(procs) {
            return schedulePreemptiveByKey(procs, p => p.priority);
        }

        // ── Priority + Round Robin (p.53–54) ────────────────────────────
        // Highest priority runs; equal priorities share the CPU with RR (quantum q).
        // A process alone at its level keeps running after its quantum (p.54).
        // A newly arrived higher-priority process preempts; the preempted one goes to the tail of its level.
        function schedulePriorityRR(procs, quantum) {
            const q = quantum;
            const pool = procs.map(p => ({ ...p, rem: p.burst, firstStart: -1 }));
            const sorted = [...pool].sort((a, b) => a.arrival - b.arrival || a.id - b.id);
            const levels = new Map();                     // priority → FIFO array
            const gantt = [], results = {}, queueTrace = [];
            let time = 0, completed = 0, nextIdx = 0;
            let running = null, used = 0, blockStart = 0;
            const maxT = procs.reduce((s, p) => s + p.burst, 0) + Math.max(...procs.map(p => p.arrival)) + 1;

            const enqueue = (p) => {
                if (!levels.has(p.priority)) levels.set(p.priority, []);
                levels.get(p.priority).push(p);
            };
            const admit = () => { while (nextIdx < sorted.length && sorted[nextIdx].arrival <= time) enqueue(sorted[nextIdx++]); };
            const bestLevel = () => {
                let best = null;
                for (const [pr, arr] of levels) if (arr.length && (best === null || pr < best)) best = pr;
                return best;
            };
            const readyOrder = () => [...levels.keys()].sort((a, b) => a - b).flatMap(pr => levels.get(pr).map(p => p.id));

            admit();
            while (completed < pool.length && time <= maxT) {
                if (running) {
                    const bl = bestLevel();
                    const higherArrived = bl !== null && bl < running.priority;
                    const quantumUp = used >= q && bl !== null && bl === running.priority;
                    if (higherArrived || quantumUp) {
                        gantt.push({ pid: running.id, name: running.name, start: blockStart, end: time, color: running.color });
                        enqueue(running);
                        running = null;
                    } else if (used >= q) {
                        used = 0;                         // only runnable process at its level → keeps the CPU
                    }
                }
                if (!running) {
                    const bl = bestLevel();
                    if (bl === null) {
                        if (nextIdx >= sorted.length) break;
                        time = emitIdle(gantt, time, sorted[nextIdx].arrival);
                        admit();
                        continue;
                    }
                    running = levels.get(bl).shift();
                    used = 0;
                    blockStart = time;
                    if (running.firstStart < 0) running.firstStart = time;
                }
                queueTrace[time] = readyOrder();
                running.rem--;
                used++;
                time++;
                admit();
                if (running.rem === 0) {
                    gantt.push({ pid: running.id, name: running.name, start: blockStart, end: time, color: running.color });
                    results[running.id] = buildResult(running, running.firstStart, time);
                    completed++;
                    running = null;
                }
            }
            return { gantt, results, queueTrace };
        }

        function flushBlock(gantt, pool, pid, start, end) {
            const p = pool.find(x => x.id === pid);
            gantt.push({ pid, name: p.name, start, end, color: p.color });
        }

        /* ════════════════════════════════════════════════════════════════
           DISPATCH
           ════════════════════════════════════════════════════════════════ */
        const ALGO_FN = {
            fcfs: scheduleFCFS,
            sjf: scheduleSJF,
            sjf_preemptive: scheduleSRTF,
            rr: scheduleRR,
            priority: schedulePriority,
            priority_preemptive: schedulePriorityPre,
            priority_rr: schedulePriorityRR,
        };

        function dispatch(algo, procs, quantum) {
            const fn = ALGO_FN[algo];
            return QUANTUM_ALGOS.includes(algo) ? fn(procs, quantum) : fn(procs);
        }

        function algoLabel(algo, quantum) {
            return ALGO_LABELS[algo] + (QUANTUM_ALGOS.includes(algo) ? ` (q=${quantum})` : '');
        }

        /* ════════════════════════════════════════════════════════════════
           STATS — makespan, CPU utilization, throughput, context switches
           Context switch = the CPU goes directly from one process to a
           different process. Voluntary = the previous process finished;
           nonvoluntary = it was preempted (Ch.4 p.16).
           ════════════════════════════════════════════════════════════════ */
        function computeStats(result, n) {
            const g = result.gantt;
            if (!g || !g.length) {
                return { totalTime: 0, idleTime: 0, cpuUtil: 0, throughput: 0, contextSwitches: 0, voluntary: 0, nonvoluntary: 0 };
            }
            const totalTime = g[g.length - 1].end;     // schedule starts at t = 0
            let idleTime = 0, voluntary = 0, nonvoluntary = 0, prev = null;
            for (const b of g) {
                if (b.pid === null) { idleTime += b.end - b.start; prev = null; continue; }
                if (prev && prev.pid !== b.pid && prev.end === b.start) {
                    if (result.results[prev.pid].finish === prev.end) voluntary++;
                    else nonvoluntary++;
                }
                prev = b;
            }
            return {
                totalTime,
                idleTime,
                cpuUtil: totalTime > 0 ? (totalTime - idleTime) / totalTime * 100 : 0,
                throughput: totalTime > 0 ? n / totalTime : 0,
                contextSwitches: voluntary + nonvoluntary,
                voluntary,
                nonvoluntary,
            };
        }

        function averages(result) {
            const vals = Object.values(result.results);
            const n = vals.length || 1;
            return {
                avgWaiting: vals.reduce((s, v) => s + v.waiting, 0) / n,
                avgTurnaround: vals.reduce((s, v) => s + v.turnaround, 0) / n,
                avgResponse: vals.reduce((s, v) => s + v.response, 0) / n,
            };
        }

        /* ════════════════════════════════════════════════════════════════
           STEP-BY-STEP ANIMATION TIMELINE BUILDER
           Snapshot at time t = state during the interval [t, t+1).
           ════════════════════════════════════════════════════════════════ */
        function readyComparator(algo, rem) {
            const fifo = (a, b) => a.arrival - b.arrival || a.id - b.id;
            switch (algo) {
                case 'sjf': return (a, b) => a.burst - b.burst || fifo(a, b);
                case 'sjf_preemptive': return (a, b) => rem.get(a.id) - rem.get(b.id) || fifo(a, b);
                case 'priority':
                case 'priority_preemptive':
                case 'priority_rr': return (a, b) => a.priority - b.priority || fifo(a, b);
                default: return fifo;
            }
        }

        function queueHintKey(algo) {
            return {
                fcfs: 'qorder.fifo', rr: 'qorder.fifo', sjf: 'qorder.burst', sjf_preemptive: 'qorder.rem',
                priority: 'qorder.pri', priority_preemptive: 'qorder.pri', priority_rr: 'qorder.prirr',
            }[algo];
        }

        function buildAnimTimeline(result, procs, algo) {
            const g = result.gantt;
            if (!g || !g.length) return [];
            const totalTime = g[g.length - 1].end;
            const byId = new Map(procs.map(p => [p.id, p]));
            const finish = new Map(procs.map(p => [p.id, result.results[p.id].finish]));
            const rem = new Map(procs.map(p => [p.id, p.burst]));
            const cmp = readyComparator(algo, rem);
            const chip = (p) => ({
                pid: p.id, name: p.name, color: p.color,
                arrival: p.arrival, burst: p.burst, priority: p.priority,
                rem: rem.get(p.id), finish: finish.get(p.id),
            });
            const timeline = [];
            let bi = 0;

            for (let t = 0; t <= totalTime; t++) {
                while (bi < g.length && g[bi].end <= t) bi++;
                const runningId = (bi < g.length && g[bi].start <= t && g[bi].pid !== null) ? g[bi].pid : null;

                const completed = procs
                    .filter(p => finish.get(p.id) <= t)
                    .sort((a, b) => finish.get(a.id) - finish.get(b.id) || a.id - b.id);

                const ready = procs.filter(p => p.arrival <= t && finish.get(p.id) > t && p.id !== runningId);
                const trace = result.queueTrace && result.queueTrace[t];
                if (trace) {
                    const pos = new Map(trace.map((id, i) => [id, i]));
                    const at = (p) => (pos.has(p.id) ? pos.get(p.id) : Infinity);
                    ready.sort((a, b) => (at(a) - at(b)) || cmp(a, b));
                } else {
                    ready.sort(cmp);
                }

                timeline.push({
                    time: t,
                    running: runningId !== null ? chip(byId.get(runningId)) : null,
                    readyQueue: ready.map(chip),
                    completed: completed.map(chip),
                    // only blocks that have actually started (no zero-length blocks)
                    ganttUpTo: g.filter(b => b.start < t).map(b => ({ ...b, end: Math.min(b.end, t) })),
                });

                if (runningId !== null) rem.set(runningId, rem.get(runningId) - 1);
            }
            return timeline;
        }

        /* ════════════════════════════════════════════════════════════════
           ANIMATION CONTROLS
           ════════════════════════════════════════════════════════════════ */
        function animStop() {
            animPlaying = false;
            if (animInterval) clearInterval(animInterval);
            animInterval = null;
            const btn = $('btnAnimPlay');
            if (btn) btn.textContent = t('anim.play');
        }

        function animStartTimer() {
            if (animInterval) clearInterval(animInterval);
            animInterval = setInterval(() => {
                if (animCurrentTime < animTimeline.length - 1) {
                    animCurrentTime++;
                    renderAnimFrame();
                } else {
                    animStop();
                }
            }, animSpeed);
        }

        function animTogglePlay() {
            if (animPlaying) { animStop(); return; }
            if (animCurrentTime >= animTimeline.length - 1) {   // at the end → replay from t = 0
                animCurrentTime = 0;
                renderAnimFrame();
            }
            animPlaying = true;
            $('btnAnimPlay').textContent = t('anim.pause');
            animStartTimer();
        }

        function animStepFwd() {
            animStop();
            if (animCurrentTime < animTimeline.length - 1) {
                animCurrentTime++;
                renderAnimFrame();
            }
        }

        function animStepBack() {
            animStop();
            if (animCurrentTime > 0) {
                animCurrentTime--;
                renderAnimFrame();
            }
        }

        function animReset() {
            animStop();
            animCurrentTime = 0;
            renderAnimFrame();
        }

        function animUpdateSpeed() {
            animSpeed = parseInt($('animSpeed').value, 10) || 500;
            if (animPlaying) animStartTimer();
        }

        function renderAnimFrame() {
            if (!animTimeline.length) return;
            const snap = animTimeline[animCurrentTime];
            $('animTimeDisplay').textContent = snap.time;
            const pct = animTimeline.length > 1 ? (animCurrentTime / (animTimeline.length - 1)) * 100 : 100;
            $('animProgressBar').style.width = pct + '%';
            renderPipeline(snap);
            if (snap.ganttUpTo.length) {
                renderGantt(snap.ganttUpTo, $('ganttTrack'), $('ganttTimeline'), MIN_BLOCK_PX, ganttAnimateOnce);
                ganttAnimateOnce = false;
            } else {
                $('ganttTrack').innerHTML = `<div style="padding:20px;color:var(--text-3)">${t('gantt.empty')}</div>`;
                $('ganttTimeline').innerHTML = '';
            }
        }

        /* ════════════════════════════════════════════════════════════════
           PIPELINE RENDERING
           ════════════════════════════════════════════════════════════════ */
        function chipDetails(p, stage) {
            const item = (label, v, hl) => `<span class="${hl ? 'pipeline__meta-hl' : ''}">${label} <b>${v}</b></span>`;
            const parts = [
                item(t('pipe.arrival'), p.arrival),
                item(t('pipe.burst'), p.burst),
                item(t('pipe.priority'), p.priority),
            ];
            parts.push(stage === 'completed' ? item(t('pipe.finish'), p.finish, true) : item(t('pipe.rem'), p.rem, true));
            return `<span class="pipeline__meta">${parts.join('')}</span>`;
        }

        function chipHtml(p, stage, isNew, extraStyle = '') {
            return `<div class="pipeline__item${isNew ? ' is-new' : ''}" style="background:${p.color};${extraStyle}">
        <span class="pipeline__name">${p.name}${stage === 'completed' ? ' ✓' : ''}</span>${chipDetails(p, stage)}
    </div>`;
        }

        function renderPipeline(snap) {
            const empty = (txt) => `<div class="pipeline__empty">${txt}</div>`;
            // only chips that just moved into a stage get the slide-in animation (no flashing on every frame)
            const prev = pipePrev;

            $('pipeReadyCount').textContent = snap.readyQueue.length;
            $('pipeReadyHint').textContent = lastSingle ? t(queueHintKey(lastSingle.algo)) : '';
            $('pipeReadyItems').innerHTML = snap.readyQueue.length
                ? snap.readyQueue.map(p => chipHtml(p, 'ready', !prev.ready.has(p.pid))).join('')
                : empty(t('pipe.empty'));

            $('pipeRunningItems').innerHTML = snap.running
                ? chipHtml(snap.running, 'running', prev.running !== snap.running.pid)
                : empty(t('pipe.idle'));

            $('pipeCompCount').textContent = snap.completed.length;
            $('pipeCompItems').innerHTML = snap.completed.length
                ? snap.completed.map(p => chipHtml(p, 'completed', !prev.completed.has(p.pid), 'opacity:0.75;')).join('')
                : empty('—');

            pipePrev = {
                ready: new Set(snap.readyQueue.map(p => p.pid)),
                running: snap.running ? snap.running.pid : null,
                completed: new Set(snap.completed.map(p => p.pid)),
            };
        }

        /* ════════════════════════════════════════════════════════════════
           PER-PROCESS TIMELINE
           ════════════════════════════════════════════════════════════════ */
        function renderProcessTimeline(gantt, procs) {
            const container = $('procTimeline');
            if (!gantt || !gantt.length || !procs.length) {
                container.innerHTML = `<div style="color:var(--text-3);padding:16px;text-align:center;">${t('gantt.none')}</div>`;
                return;
            }

            const totalTime = gantt[gantt.length - 1].end;
            let html = '';

            for (const proc of procs) {
                const states = new Array(totalTime).fill('idle');
                for (let t0 = 0; t0 < Math.min(proc.arrival, totalTime); t0++) states[t0] = 'notarrived';

                let lastFinish = 0;
                for (const block of gantt) {
                    if (block.pid === proc.id) {
                        for (let t0 = block.start; t0 < block.end && t0 < totalTime; t0++) states[t0] = 'running';
                        lastFinish = Math.max(lastFinish, block.end);
                    }
                }
                for (let t0 = proc.arrival; t0 < lastFinish && t0 < totalTime; t0++) {
                    if (states[t0] === 'idle') states[t0] = 'waiting';
                }

                const segments = [];
                let cur = { state: states[0], start: 0, len: 1 };
                for (let t0 = 1; t0 < totalTime; t0++) {
                    if (states[t0] === cur.state) cur.len++;
                    else { segments.push(cur); cur = { state: states[t0], start: t0, len: 1 }; }
                }
                segments.push(cur);

                html += `<div class="proc-timeline__row">
            <div class="proc-timeline__label" style="color:${proc.color}">${proc.name}</div>
            <div class="proc-timeline__track">`;
                for (const seg of segments) {
                    const bgStyle = seg.state === 'running' ? `background:${proc.color};` : '';
                    let label = '';
                    if (seg.state === 'running' && seg.len >= 2) label = 'R';
                    if (seg.state === 'waiting' && seg.len >= 2) label = 'W';
                    html += `<div class="proc-timeline__segment proc-timeline__segment--${seg.state}"
                style="flex:${seg.len};${bgStyle}"
                title="${proc.name}: ${t('ptl.state.' + seg.state)} (${seg.start}–${seg.start + seg.len})">${label}</div>`;
                }
                html += `</div></div>`;
            }

            html += `<div class="proc-timeline__ticks">`;
            const step = totalTime <= 30 ? 1 : totalTime <= 60 ? 2 : totalTime <= 150 ? 5 : 10;
            for (let t0 = 0; t0 <= totalTime; t0 += step) {
                html += `<div class="proc-timeline__tick" style="flex:${step};min-width:0">${t0}</div>`;
            }
            html += `</div>`;

            html += `<div class="proc-timeline__legend">
        <div class="proc-timeline__legend-item">
            <div class="proc-timeline__legend-swatch" style="background:#22C55E;"></div> ${t('ptl.running')}
        </div>
        <div class="proc-timeline__legend-item">
            <div class="proc-timeline__legend-swatch" style="background:repeating-linear-gradient(45deg,rgba(245,158,11,0.5),rgba(245,158,11,0.5) 3px,transparent 3px,transparent 6px);border:1px solid rgba(245,158,11,0.5);"></div> ${t('ptl.waiting')}
        </div>
        <div class="proc-timeline__legend-item">
            <div class="proc-timeline__legend-swatch" style="background:#64748B;border:1px solid var(--border);"></div> ${t('ptl.idle')}
        </div>
    </div>`;

            container.innerHTML = html;
        }

        /* ════════════════════════════════════════════════════════════════
           SIMULATION — SINGLE
           ════════════════════════════════════════════════════════════════ */
        function runSimulation() {
            clearError();
            if (!processes.length) return showError('err.noProc');
            const algo = $('selAlgo').value;
            let quantum = null;
            if (QUANTUM_ALGOS.includes(algo)) {
                quantum = readQuantum();
                if (quantum === null) return;
            }

            animStop();
            const result = dispatch(algo, processes, quantum);
            lastSingle = { algo, quantum, result, stats: computeStats(result, processes.length) };

            $('sectionResult').style.display = 'block';
            $('sectionCompare').style.display = 'none';

            animTimeline = buildAnimTimeline(result, processes, algo);
            animCurrentTime = animTimeline.length - 1;   // start at the end (full result)
            ganttAnimateOnce = true;
            pipePrev = { ready: new Set(), running: null, completed: new Set() };
            refreshSingleView();

            $('sectionResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function refreshSingleView() {
            const { algo, quantum, result, stats } = lastSingle;
            $('txtResultTitle').textContent = t('result.title', { algo: algoLabel(algo, quantum) });
            renderStatsGrid(stats, $('statsGrid'), processes.length);
            renderAnimFrame();
            renderProcessTimeline(result.gantt, processes);
            renderResultsTable(result.results);
        }

        function renderStatsGrid(stats, container, n) {
            const unit = (u) => `<span style="font-size:0.7rem;opacity:0.6;"> ${u}</span>`;
            container.innerHTML = `
        <div class="stat-card">
            <div class="stat-card__label">${t('st.makespan')}</div>
            <div class="stat-card__value stat-card__value--indigo">${stats.totalTime}${unit('ms')}</div>
        </div>
        <div class="stat-card">
            <div class="stat-card__label">${t('st.util')}</div>
            <div class="stat-card__value stat-card__value--emerald">${stats.cpuUtil.toFixed(1)}${unit('%')}</div>
        </div>
        <div class="stat-card">
            <div class="stat-card__label">${t('st.throughput')}</div>
            <div class="stat-card__value stat-card__value--cyan">${stats.throughput.toFixed(3)}${unit('/ms')}</div>
            <div class="stat-card__sub">${t('st.throughputSub', { n, t: stats.totalTime })}</div>
        </div>
        <div class="stat-card">
            <div class="stat-card__label">${t('st.cs')}</div>
            <div class="stat-card__value stat-card__value--cs">${stats.contextSwitches}</div>
            <div class="stat-card__sub">${t('st.csSub', { v: stats.voluntary, nv: stats.nonvoluntary })}</div>
        </div>
        <div class="stat-card">
            <div class="stat-card__label">${t('st.idle')}</div>
            <div class="stat-card__value stat-card__value--idle">${stats.idleTime}${unit('ms')}</div>
        </div>`;
        }

        /* ════════════════════════════════════════════════════════════════
           SIMULATION — COMPARE ALL
           ════════════════════════════════════════════════════════════════ */
        function runAllAndCompare() {
            clearError();
            if (!processes.length) return showError('err.noProc');
            const quantum = readQuantum();          // used by RR and Priority + RR
            if (quantum === null) return;

            animStop();
            compQuantum = quantum;
            comparisonData = {};
            for (const algo of ALL_ALGO_KEYS) {
                const res = dispatch(algo, processes, quantum);
                comparisonData[algo] = {
                    ...res,
                    ...averages(res),
                    label: algoLabel(algo, quantum),
                    stats: computeStats(res, processes.length),
                };
            }

            $('sectionResult').style.display = 'none';
            $('sectionCompare').style.display = 'block';
            refreshCompareView(true);
            $('sectionCompare').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function refreshCompareView(animate = false) {
            renderCompTable();
            renderCompGantts(animate);
        }

        /* ════════════════════════════════════════════════════════════════
           RENDERING — GANTT CHART
           ════════════════════════════════════════════════════════════════ */
        function renderGantt(gantt, trackEl, tlEl, minPx = MIN_BLOCK_PX, animate = false) {
            trackEl.classList.toggle('is-animated', animate);
            if (!gantt?.length) {
                trackEl.innerHTML = `<div style="padding:20px;color:var(--text-3)">${t('gantt.none')}</div>`;
                tlEl.innerHTML = '';
                return;
            }
            trackEl.innerHTML = gantt.map((b, i) => {
                const dur = b.end - b.start;
                const idle = b.pid === null;
                const ci = idle ? -1 : processes.findIndex(p => p.id === b.pid) % 10;
                const tip = idle ? `${t('gantt.idle')}: ${b.start}→${b.end}` : `${b.name}: ${b.start}→${b.end} (${dur} ms)`;
                return `<div class="gantt__block ${idle ? 'gantt__block--idle' : `pc-${ci}`}"
                     style="flex:${dur};min-width:${minPx}px;${animate ? `animation-delay:${Math.min(i * 0.06, 1.5)}s` : ''}"
                     data-tip="${tip}">${idle ? t('gantt.idle') : b.name}</div>`;
            }).join('');

            tlEl.innerHTML = '';
            for (const b of gantt) {
                const d = document.createElement('div');
                d.className = 'gantt__tick';
                d.style.flex = b.end - b.start;
                d.style.minWidth = minPx + 'px';
                d.textContent = b.start;
                tlEl.appendChild(d);
            }
            const last = document.createElement('div');
            last.className = 'gantt__tick';
            last.style.flex = '0';
            last.style.minWidth = '0';
            last.textContent = gantt[gantt.length - 1].end;
            tlEl.appendChild(last);
        }

        function renderGanttInto(gantt, container, minPx = MIN_BLOCK_PX_S, animate = false) {
            if (!gantt?.length) return;
            const track = document.createElement('div');
            track.className = 'gantt__track';
            const tl = document.createElement('div');
            tl.className = 'gantt__timeline';
            container.appendChild(track);
            container.appendChild(tl);
            renderGantt(gantt, track, tl, minPx, animate);
        }

        /* ════════════════════════════════════════════════════════════════
           RENDERING — RESULTS TABLE
           ════════════════════════════════════════════════════════════════ */
        function renderResultsTable(results) {
            const order = new Map(processes.map((p, i) => [p.id, i]));
            const vals = Object.entries(results)
                .sort(([a], [b]) => order.get(Number(a)) - order.get(Number(b)))
                .map(([, r]) => r);
            const n = vals.length;
            let html = vals.map(r => `
        <tr>
            <td><span class="dot-color" style="background:${r.color}"></span>${r.name}</td>
            <td>${r.arrival}</td><td>${r.burst}</td><td>${r.priority}</td>
            <td>${r.start}</td><td>${r.finish}</td>
            <td>${r.waiting}</td><td>${r.turnaround}</td><td>${r.response}</td>
        </tr>`).join('');
            const avg = (key) => (vals.reduce((s, v) => s + v[key], 0) / n).toFixed(2);
            html += `<tr class="avg-row">
        <td colspan="6" style="text-align:right;font-family:Inter,sans-serif;">${t('res.avg')}</td>
        <td>${avg('waiting')}</td><td>${avg('turnaround')}</td><td>${avg('response')}</td>
    </tr>`;
            $('tbodyResults').innerHTML = html;
        }

        /* ════════════════════════════════════════════════════════════════
           RENDERING — COMPARISON
           ════════════════════════════════════════════════════════════════ */
        const EPS = 1e-9;

        function renderCompTable() {
            $('theadCompare').innerHTML = `<tr>
        <th>${t('th.algorithm')}</th><th>${t('th.avgW')}</th><th>${t('th.avgT')}</th>
        <th>${t('th.avgR')}</th><th>${t('th.cs')}</th>
    </tr>`;

            const min = (f) => Math.min(...ALL_ALGO_KEYS.map(a => f(comparisonData[a])));
            const minW = min(d => d.avgWaiting);
            const minT = min(d => d.avgTurnaround);
            const minR = min(d => d.avgResponse);
            const minC = min(d => d.stats.contextSwitches);
            const hl = (v, best) => Math.abs(v - best) < EPS ? 'color:var(--emerald);font-weight:800;' : '';

            $('tbodyCompare').innerHTML = ALL_ALGO_KEYS.map(a => {
                const d = comparisonData[a];
                return `<tr>
            <td style="text-align:left;font-family:Inter,sans-serif;font-weight:600;">${d.label}</td>
            <td style="${hl(d.avgWaiting, minW)}">${d.avgWaiting.toFixed(2)}</td>
            <td style="${hl(d.avgTurnaround, minT)}">${d.avgTurnaround.toFixed(2)}</td>
            <td style="${hl(d.avgResponse, minR)}">${d.avgResponse.toFixed(2)}</td>
            <td style="${hl(d.stats.contextSwitches, minC)}">${d.stats.contextSwitches}</td>
        </tr>`;
            }).join('');
        }

        function renderCompGantts(animate = false) {
            const wrap = $('compGantts');
            wrap.innerHTML = '';
            for (const algo of ALL_ALGO_KEYS) {
                const box = document.createElement('div');
                box.className = 'gantt';
                box.style.marginBottom = '12px';
                const lbl = document.createElement('div');
                lbl.className = 'gantt__label';
                lbl.textContent = comparisonData[algo].label;
                box.appendChild(lbl);
                renderGanttInto(comparisonData[algo].gantt, box, MIN_BLOCK_PX_S, animate);
                wrap.appendChild(box);
            }
        }

        /* ════════════════════════════════════════════════════════════════
           INIT
           ════════════════════════════════════════════════════════════════ */
        (function init() {
            const savedLang = storeGet('lang');
            lang = I18N[savedLang] ? savedLang : 'en';
            onAlgoChange();
            applyLang();
        })();

        // Floating tooltip for Gantt blocks — positioned in the viewport, so it is never clipped
        const ganttTip = document.createElement('div');
        ganttTip.className = 'gantt-tip';
        ganttTip.setAttribute('role', 'tooltip');
        document.body.appendChild(ganttTip);

        function placeGanttTip(block) {
            ganttTip.textContent = block.dataset.tip;
            ganttTip.classList.add('is-visible');
            const r = block.getBoundingClientRect();
            const tw = ganttTip.offsetWidth, th = ganttTip.offsetHeight;
            const x = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 8));
            const y = r.top - th - 8 >= 8 ? r.top - th - 8 : r.bottom + 8;
            ganttTip.style.left = x + 'px';
            ganttTip.style.top = y + 'px';
        }

        document.addEventListener('mouseover', (e) => {
            const block = e.target.closest && e.target.closest('.gantt__block[data-tip]');
            if (block) placeGanttTip(block);
            else ganttTip.classList.remove('is-visible');
        });
        window.addEventListener('scroll', () => ganttTip.classList.remove('is-visible'), { passive: true });

        // Enter key to quickly add processes
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && ['inpBurst', 'inpArrival', 'inpPriority'].includes(document.activeElement?.id)) {
                addProcess();
            }
        });
    </script>
</body>
